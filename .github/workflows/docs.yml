name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "go/examples/**"
      - "scripts/*docs*.py"
      - ".github/workflows/docs.yml"
  push:
    paths:
      - "docs/**"
      - "go/examples/**"
      - "scripts/*docs*.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [production, staging]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: python scripts/build-docs.py --environment ${{ matrix.environment }}
      - uses: actions/upload-artifact@v4
        with:
          name: sentiary-docs-${{ matrix.environment }}
          path: docs/site/
          if-no-files-found: error
