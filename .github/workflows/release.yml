name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Test and resolve version
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: prepare
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: ".exe"
          - goos: windows
            goarch: arm64
            extension: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI and MCP
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          cli_binary="sentiary-cli-${GOOS}-${GOARCH}${{ matrix.extension }}"
          mcp_binary="sentiary-mcp-server-${GOOS}-${GOARCH}${{ matrix.extension }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/MateeDevs/sentiary-tools/internal/buildinfo.Version=${VERSION}" \
            -o "dist/${cli_binary}" \
            ./cmd/sentiary-cli
          go build -trimpath \
            -ldflags="-s -w -X github.com/MateeDevs/sentiary-tools/internal/buildinfo.Version=${VERSION}" \
            -o "dist/${mcp_binary}" \
            ./cmd/sentiary-mcp

      - name: Package downloads
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.goos }}" != "windows" ]; then
            tar -czf "sentiary-cli-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
              "sentiary-cli-${{ matrix.goos }}-${{ matrix.goarch }}"
            tar -czf "sentiary-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
              "sentiary-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi

      - name: Upload downloads
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/sentiary-*
          if-no-files-found: error

  release:
    name: Create release
    needs:
      - prepare
      - build
    runs-on: self-hosted

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd dist
          shasum -a 256 sentiary-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Sentiary CLI and MCP ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## CLI

            Install the latest `sentiary-cli` release:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/MateeDevs/sentiary-tools/main/install.sh | sh
            ```

            On Windows, run this command in PowerShell:

            ```powershell
            irm https://raw.githubusercontent.com/MateeDevs/sentiary-tools/main/install.ps1 | iex
            ```

            The installers support AMD64 and ARM64 on macOS, Linux, and Windows.

            Set your personal API key before you run a command:

            ```sh
            export SENTIARY_USER_API_KEY="your-personal-api-key"
            ```

            Keep this key private. The CLI uses your Sentiary account and permissions.

            ## Agent skills

            - [Sentiary CLI skill](https://github.com/MateeDevs/sentiary-tools/tree/main/.agents/skills/sentiary-cli)
            - [Sentiary MCP skill](https://github.com/MateeDevs/sentiary-tools/tree/main/.agents/skills/sentiary-mcp)
          generate_release_notes: true
          make_latest: true
          files: |
            dist/sentiary-*
            dist/SHA256SUMS
