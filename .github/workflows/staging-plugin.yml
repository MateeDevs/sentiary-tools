name: Staging plugin
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build integration CLI
        run: go build -o "$RUNNER_TEMP/sentiary-cli" ./cmd/sentiary-cli
      - name: Check plugin and integration fixtures
        env:
          SENTIARY_TEST_CLI: ${{ runner.temp }}/sentiary-cli
        run: ./gradlew :sentiary:test :sentiary:ktlintCheck :sentiary:validatePlugins :sentiary:assemble
      - uses: actions/upload-artifact@v4
        with:
          name: sentiary-gradle-plugin-staging
          path: |
            sentiary/build/libs/
            sentiary/build/reports/
          if-no-files-found: error
