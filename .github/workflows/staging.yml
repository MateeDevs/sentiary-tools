name: Staging CLI
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Build staging CLI
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [ "$os" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/MateeDevs/sentiary-tools/internal/buildinfo.Version=staging-${GITHUB_SHA}" \
              -o "dist/sentiary-cli-${os}-${arch}${suffix}" ./cmd/sentiary-cli
          done
          cd dist
          sha256sum sentiary-cli-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sentiary-cli-staging
          path: dist/
          if-no-files-found: error
