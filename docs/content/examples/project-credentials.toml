config_version = 1

[projects.mobile]
id = "MOBILE_PROJECT_ID"
api_key = { env = "SENTIARY_MOBILE_API_KEY" }
languages = ["en", "cs"]

[projects.backoffice]
id = "BACKOFFICE_PROJECT_ID"
api_key = { env = "SENTIARY_BACKOFFICE_API_KEY" }
languages = ["en", "cs"]

[outputs.mobile]
project = "mobile"
format = "compose"
path = "build/mobile/{language}/strings.xml"

[outputs.backoffice]
project = "backoffice"
format = "key_value_json"
path = "build/backoffice/{language}.json"
