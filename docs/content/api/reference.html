<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentiary staging REST API reference</title>
    <link rel="icon" href="../assets/favicon.ico">
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <noscript>
      <p>Enable JavaScript to view the API reference, or <a href="/api/openapi.yaml">download the OpenAPI schema</a>.</p>
    </noscript>
    <div id="api-reference"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.0/dist/browser/standalone.js" integrity="sha384-oH1C0RwqcwbVXkC+r8A+4qRoyEUQdtxAzOwumkxZtQBBcsy61FOoPt7B50OVJYYQ" crossorigin="anonymous"></script>
    <script>
      Scalar.createApiReference("#api-reference", {
        url: "/api/openapi.yaml",
        hideTestRequestButton: true,
        hideClientButton: true,
        showDeveloperTools: "never",
        withDefaultFonts: false,
      });
    </script>
  </body>
</html>
